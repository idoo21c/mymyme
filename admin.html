<style>

.bar{height:10px;border-radius:5px;background:#F0ECE4;flex:1}.bar>div{height:10px;border-radius:5px;background:var(--acc)}

.chart span.b{width:45%;border-radius:3px 3px 0 0}

<div class="wrap" id="app"></div>
<script>
var ENDPOINT = "https://script.google.com/macros/s/AKfycbx2G0QG_yhq32sInKS2ScJDQsfuMxgpo4yIwiy5BEvhhK5LCy239wUOnT-Dz-FZsfGE/exec";
var KEY = ''; try { KEY = sessionStorage.getItem('mm_admin') || ''; } catch (e) {}
var app = document.getElementById('app'), DATA = null, FILTER = 'all', CONS = [], CFILTER = 'open';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function pct(a, b) { return b ? Math.round(a / b * 100) + '%' : '–'; }
var STEM_READ = { 甲: '갑목', 乙: '을목', 丙: '병화', 丁: '정화', 戊: '무토', 己: '기토', 庚: '경금', 辛: '신금', 壬: '임수', 癸: '계수' };
var GENDER = { f: '여성', m: '남성', none: '선택 안 함' };

function setup() {
  app.innerHTML = '<h1>MyMyMe 관리자</h1><div class="card"><h2>데이터 수집이 아직 연결되지 않았어요</h2><ol class="small">' +
    '<li>구글 시트 <b>MyMyMe 운영 데이터</b>를 열고 <b>확장 프로그램 → Apps Script</b>를 눌러요.</li>' +
    '<li><code>backend/Code.gs</code> 내용을 붙여넣고, 맨 위 <code>ADMIN_KEY</code>를 관리자 비밀번호로 바꿔 저장해요.</li>' +
    '<li><b>배포 → 새 배포 → 웹 앱</b>, 실행 사용자 <b>나</b>, 액세스 <b>모든 사용자</b>로 배포해요.</li>' +
    '<li>나온 웹 앱 URL을 Claude에게 알려주면 이 페이지와 사이트에 연결돼요.</li></ol></div>';
}
function login(msg) {
  app.innerHTML = '<h1>MyMyMe 관리자</h1><form class="card" id="f" style="display:flex;flex-direction:column;gap:12px;max-width:420px"><label for="k" class="small" style="font-weight:500">관리자 비밀번호</label>' +
    '<div class="row"><input id="k" type="password" autocomplete="current-password"><button type="submit">들어가기</button></div>' + (msg ? '<p class="err" role="alert">' + esc(msg) + '</p>' : '') + '</form>';
  document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); KEY = document.getElementById('k').value; try { sessionStorage.setItem('mm_admin', KEY); } catch (er) {} load(); });
}
function load() {
  app.innerHTML = '<h1>MyMyMe 관리자</h1><p class="muted">불러오는 중…</p>';
  fetch(ENDPOINT + '?action=stats&key=' + encodeURIComponent(KEY)).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) { try { sessionStorage.removeItem('mm_admin'); } catch (e) {} login(j.reason === 'auth' ? '비밀번호가 맞지 않거나, 스크립트의 ADMIN_KEY가 아직 기본값이에요.' : '데이터를 불러오지 못했어요.'); return; }
    DATA = j;
    return fetch(ENDPOINT + '?action=consults&key=' + encodeURIComponent(KEY)).then(function (r) { return r.json(); }).then(function (c) { CONS = (c && c.items) || []; render(); });
  }).catch(function () { login('서버에 연결하지 못했어요. 웹 앱 URL과 배포 설정(액세스: 모든 사용자)을 확인해 주세요.'); });
}
function kpi(l, v, s) { return '<div class="card kpi"><div class="l">' + l + '</div><div class="v">' + v + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>'; }
function dist(title, obj, map, top) {
  var arr = Object.keys(obj).map(function (k) { return [k, obj[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, top || 12);
  var max = arr.length ? arr[0][1] : 1, sum = arr.reduce(function (a, b) { return a + b[1]; }, 0);
  return '<div class="card dist"><h2>' + title + '</h2>' + (arr.length ? arr.map(function (x) {
    return '<div class="row"><span class="k" title="' + esc(x[0]) + '">' + esc(map ? (map[x[0]] || x[0]) + (map[x[0]] ? ' ' + x[0] : '') : x[0]) + '</span><div class="bar"><div style="width:' + (x[1] / max * 100) + '%"></div></div><span class="n">' + x[1] + '</span><span class="small muted" style="width:40px">' + pct(x[1], sum) + '</span></div>';
  }).join('') : '<p class="small muted">아직 데이터가 없어요</p>') + '</div>';
}
var WHO = { user: '상담자', ai: 'AI 답변', admin: '운영자(나)' };
function consultBox() {
  var list = CONS.filter(function (c) { return CFILTER === 'all' || c.status !== '답변 완료'; });
  return '<div class="card"><div class="row between" style="flex-wrap:wrap;margin-bottom:6px"><h2 style="margin:0">상담함</h2><div class="row">' +
    [['open', '답변 필요'], ['all', '전체']].map(function (f) { return '<button class="sec" data-cfilter="' + f[0] + '" style="' + (CFILTER === f[0] ? 'border-color:var(--ink);font-weight:700' : '') + '">' + f[1] + '</button>'; }).join('') + '</div></div>' +
    '<p class="small muted">위기 단어가 있는 상담이 맨 위에 와요. AI가 1차 답변을 했더라도, 운영자 답변을 남기면 상담자 화면에 댓글로 보여요.</p>' +
    (list.length ? list.map(function (c) {
      var x = c.ctx || {}, chips = [x.name, x.code, x.dayMaster && (x.dayMaster + '(' + x.dayStem + ') 일간'), x.variant, x.blood && (x.blood + '형')].filter(Boolean);
      var st = c.status === '답변 완료' ? ['var(--ok-l)', 'var(--ok)'] : c.status === 'AI 답변' ? ['var(--acc-l)', 'var(--acc)'] : ['#FBE9E3', '#8A3520'];
      return '<div class="sec-item" style="flex-direction:column;gap:10px"><div class="row" style="flex-wrap:wrap;gap:6px"><b>상담 ' + esc(c.id) + '</b><span class="small muted">' + esc(c.date) + '</span>' +
        '<span class="tag" style="background:' + st[0] + ';color:' + st[1] + '">' + esc(c.status) + '</span>' + (c.crisis ? '<span class="tag" style="background:#B3261E;color:#fff">위기 신호 · 109 안내 확인</span>' : '') +
        (c.memo ? '<span class="tag" style="background:#FFF4D6;color:#7A5A00" title="' + esc(c.memo) + '">' + esc(String(c.memo).slice(0, 60)) + '</span>' : '') +
        chips.map(function (t) { return '<span class="tag" style="background:#F0ECE4;color:#33364F">' + esc(t) + '</span>'; }).join('') + '</div>' +
        c.thread.map(function (m, i) { var key = 'm|' + c.id + '|' + i, editing = EDIT === key;
          return '<div style="border-left:3px solid ' + (m.who === 'user' ? 'var(--acc)' : m.who === 'ai' ? '#4C8F66' : 'var(--coral)') + ';padding:4px 0 4px 12px;width:100%;box-sizing:border-box"><div class="row between small muted"><span><b>' + WHO[m.who] + '</b> · ' + esc(m.date) + '</span>' +
            (editing ? '' : '<span class="row" style="gap:4px">' + edBtn('data-edit="' + key + '"', true) + delBtn('data-mdel="' + key + '"', '', true) + '</span>') + '</div>' +
            (editing ? editBox(key, m.text) : '<p style="margin:4px 0 0;white-space:pre-wrap;line-height:1.6">' + esc(m.text) + '</p>') + '</div>'; }).join('') +
        '<label class="small" for="r_' + esc(c.id) + '" style="font-weight:500">운영자 답변</label><textarea id="r_' + esc(c.id) + '" style="width:100%;min-height:90px;border:1px solid #D9D5CC;border-radius:12px;padding:10px;font-family:inherit;font-size:14px"></textarea>' +
        '<div class="row"><button data-reply="' + esc(c.id) + '">답변 등록</button>' + (c.status !== '답변 완료' ? '<button class="sec" data-cdone="' + esc(c.id) + '">답변 없이 완료 처리</button>' : '<button class="sec" data-creopen="' + esc(c.id) + '">다시 열기</button>') + '<span style="flex:1"></span>' + delBtn('data-cdel="' + esc(c.id) + '"', '상담 전체 삭제') + '</div></div>';
    }).join('') : '<p class="small muted">' + (CFILTER === 'open' ? '답변이 필요한 상담이 없어요' : '아직 상담이 없어요') + '</p>') + '</div>';
}
var EDIT = null, PSEL = {};
var TA = 'display:block;box-sizing:border-box;width:100%;min-height:90px;border:1px solid #D9D5CC;border-radius:12px;padding:10px;font-family:inherit;font-size:14px';
function editBox(key, text) { return '<textarea id="ed_' + key + '" style="' + TA + '">' + esc(text) + '</textarea><div class="row" style="gap:6px"><button data-esave="' + key + '">저장</button><button class="sec" data-ecancel="1">취소</button></div>'; }
function delBtn(attrs, label, mini) { return '<button class="sec danger' + (mini ? ' mini' : '') + '" ' + attrs + '>' + (label || '삭제') + '</button>'; }
function edBtn(attrs, mini) { return '<button class="sec' + (mini ? ' mini' : '') + '" ' + attrs + '>수정</button>'; }
function apost(body) { body.key = KEY; return fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }
var TAB = 'overview', RANGE = 30, PQ = '', PFILTER = 'finished', TABLEVIEW = {};
var SERIES = ['#4B3FC7', '#D35A2E', '#1E88C9', '#A6790A'];  /* 검증된 순서 고정 팔레트 */
var CHARTS = {};
function fmtDate(d) { return d.slice(5).replace('-', '/'); }
function lineChart(id, title, unit, dates, series) {
  CHARTS[id] = { dates: dates, series: series, unit: unit };
  var W = 760, H = 260, L = 44, R = 92, T = 16, B = 30, n = dates.length;
  var maxV = Math.max(1, Math.max.apply(null, series.map(function (s) { return Math.max.apply(null, s.values.map(function (v) { return v == null ? 0 : v; })); })));
  if (unit === '%') maxV = Math.min(100, Math.max(20, Math.ceil(maxV / 20) * 20)); else { var raw = Math.max(1, maxV * 1.05 / 4), mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag, nice = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10; maxV = Math.max(4, nice * mag * 4); }
  var x = function (i) { return L + (n <= 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)); }, y = function (v) { return T + (H - T - B) * (1 - v / maxV); };
  var grid = '', ticks = 4;
  for (var g = 0; g <= ticks; g++) { var gv = maxV * g / ticks, gy = y(gv); grid += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '" stroke="#ECE8E0"/><text x="' + (L - 8) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="11" fill="#5A5D72">' + (unit === '%' ? Math.round(gv) + '%' : Math.round(gv).toLocaleString('ko-KR')) + '</text>'; }
  var step = Math.max(1, Math.ceil(n / 8)), xl = '';
  dates.forEach(function (d, i) { if (i % step === 0 || i === n - 1) xl += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="#5A5D72">' + fmtDate(d) + '</text>'; });
  var lines = series.map(function (s, si) {
    var pts = s.values.map(function (v, i) { return v == null ? null : [x(i), y(v)]; }), path = '', pen = false;
    pts.forEach(function (pt) { if (!pt) { pen = false; return; } path += (pen ? 'L' : 'M') + pt[0].toFixed(1) + ' ' + pt[1].toFixed(1); pen = true; });
    var dots = n <= 31 ? pts.map(function (pt) { return pt ? '<circle cx="' + pt[0] + '" cy="' + pt[1] + '" r="3" fill="' + s.color + '" stroke="#fff" stroke-width="2"/>' : ''; }).join('') : '';
    return '<path d="' + path + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' + dots;
  }).join('');
  /* 오른쪽 끝 라벨: 겹치지 않도록 14px 간격으로 밀어낸다 */
  var labs = series.map(function (s) { var lastI = -1; s.values.forEach(function (v, i) { if (v != null) lastI = i; }); return lastI < 0 ? null : { name: s.name, x: x(lastI) + 8, y: y(s.values[lastI]) + 4 }; }).filter(Boolean).sort(function (a, b) { return a.y - b.y; });
  for (var li = 1; li < labs.length; li++) if (labs[li].y - labs[li - 1].y < 14) labs[li].y = labs[li - 1].y + 14;
  var over = labs.length ? labs[labs.length - 1].y - (H - B + 4) : 0; if (over > 0) labs.forEach(function (l) { l.y -= over; });
  lines += labs.map(function (l) { return '<text x="' + l.x + '" y="' + l.y + '" font-size="11" fill="#33364F">' + esc(l.name) + '</text>'; }).join('');
  var legend = '<div class="legend">' + series.map(function (s) { return '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>'; }).join('') + '</div>';
  var table = '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>날짜</th>' + series.map(function (s) { return '<th>' + esc(s.name) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    dates.map(function (d, i) { return '<tr><td>' + d + '</td>' + series.map(function (s) { var v = s.values[i]; return '<td>' + (v == null ? '–' : v + (unit === '%' ? '%' : '')) + '</td>'; }).join('') + '</tr>'; }).reverse().join('') + '</tbody></table></div>';
  return '<div class="card"><div class="row between" style="margin-bottom:8px"><h2 style="margin:0">' + title + '</h2><button class="sec" data-tview="' + id + '">' + (TABLEVIEW[id] ? '그래프로 보기' : '표로 보기') + '</button></div>' +
    (TABLEVIEW[id] ? table : '<div style="position:relative"><svg id="' + id + '" viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block" role="img" aria-label="' + esc(title) + '">' + grid + xl + lines +
      '<line class="xh" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '" stroke="#9A97AE" stroke-dasharray="3 3" style="display:none"/><rect class="hit" x="' + L + '" y="' + T + '" width="' + (W - L - R) + '" height="' + (H - T - B) + '" fill="transparent"/></svg>' +
      '<div class="tip" style="display:none"></div></div>' + legend) + '</div>';

  else if (t.id === 'pall') { peopleRows().slice(0, 500).forEach(function (p) { if (t.checked) PSEL[p.sid] = 1; else delete PSEL[p.sid]; }); render(); }
});
document.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.id === 're') load();
  else if (b.id === 'out') { KEY = ''; try { sessionStorage.removeItem('mm_admin'); } catch (er) {} login(); }
  else if (b.dataset.tab) { TAB = b.dataset.tab; render(); }
  else if (b.dataset.range) { RANGE = +b.dataset.range; render(); }
  else if (b.dataset.pvlang) { PV_LANG = b.dataset.pvlang; render(); }
  else if (b.dataset.sub) { SAJU_SUB = b.dataset.sub; render(); }
  else if (b.dataset.cgift) { giftTo([b.dataset.cgift]); }
  else if (b.id === 'pgiftsel') { giftTo(Object.keys(PSEL)); }
  else if (b.id === 'gsend') { var gs = (document.getElementById('gsids').value || '').split(/[\s,]+/).filter(Boolean); giftTo(gs, +document.getElementById('gamt').value, document.getElementById('gmemo').value); }
  else if (b.dataset.gcancel) { if (confirm('이 선물을 취소할까요? 아직 받지 않은 선물만 취소돼요.')) { b.disabled = true; apost({ kind: 'admin_edit', op: 'coin_cancel', id: b.dataset.gcancel }).then(load, load); } }
  else if (b.dataset.day) { DAYSEL = b.dataset.day; render(); }
  else if (b.dataset.calm) { var cy = +CALM.slice(0, 4), cm = +CALM.slice(5, 7) + (+b.dataset.calm); if (cm < 1) { cm = 12; cy--; } if (cm > 12) { cm = 1; cy++; } CALM = cy + '-' + (cm < 10 ? '0' : '') + cm; render(); }
  else if (b.dataset.tview) { TABLEVIEW[b.dataset.tview] = !TABLEVIEW[b.dataset.tview]; render(); }
  else if (b.dataset.pfilter) { PFILTER = b.dataset.pfilter; render(); }
  else if (b.id === 'csv') downloadCsv();
  else if (b.id === 'pushTest') pushSend(true);
  else if (b.id === 'pushAll') pushSend(false);
  else if (b.id === 'meSave') { var mk = (document.getElementById('meKey').value || '').trim(), mc = mk.toUpperCase().replace(/^MM-?/, ''); if (/^[2-9A-HJKMNP-Z]{6}$/.test(mc)) mk = 'MM-' + mc; try { if (mk) localStorage.setItem(ME_KEY, mk); else localStorage.removeItem(ME_KEY); } catch (e) {} render(); }
  else if (b.dataset.edit) { EDIT = b.dataset.edit; render(); var ta0 = document.getElementById('ed_' + EDIT); if (ta0) ta0.focus(); }
  else if (b.dataset.ecancel) { EDIT = null; render(); }
  else if (b.dataset.esave) {
    var k = b.dataset.esave, parts = k.split('|'), tx = (document.getElementById('ed_' + k) || {}).value || '';
    if (!tx.trim()) return; b.disabled = true; b.textContent = '저장 중…';
    var body = parts[0] === 's' ? { kind: 'admin_edit', op: 'secret_edit', id: parts[1], text: tx } : { kind: 'admin_edit', op: 'msg_edit', id: parts[1], idx: +parts[2], text: tx };
    apost(body).then(function (j) { if (!j || !j.ok) alert('수정하지 못했어요: ' + ((j && j.reason) || '연결 오류')); EDIT = null; load(); }, function () { EDIT = null; load(); });
  }
  else if (b.dataset.sdel) { if (confirm('이 대나무숲 글을 삭제할까요? 되돌릴 수 없어요.')) { b.disabled = true; apost({ kind: 'admin_edit', op: 'secret_delete', id: b.dataset.sdel }).then(load, load); } }
  else if (b.dataset.cdel) { if (confirm('상담 ' + b.dataset.cdel + '의 글과 답변을 모두 삭제할까요? 상담자 화면에서도 사라지고, 되돌릴 수 없어요.')) { b.disabled = true; apost({ kind: 'admin_edit', op: 'consult_delete', id: b.dataset.cdel }).then(load, load); } }
  else if (b.dataset.mdel) { var mp = b.dataset.mdel.split('|'); if (confirm('이 메시지를 삭제할까요? 되돌릴 수 없어요.')) { b.disabled = true; apost({ kind: 'admin_edit', op: 'msg_delete', id: mp[1], idx: +mp[2] }).then(load, load); } }
  else if (b.dataset.pdel) { var one = b.dataset.pdel; if (confirm('참여자 ' + one + '의 기록을 모두 삭제할까요? 통계에서도 빠지고, 되돌릴 수 없어요.')) { b.disabled = true; apost({ kind: 'admin_edit', op: 'people_delete', sids: [one] }).then(function () { delete PSEL[one]; load(); }, load); } }
  else if (b.id === 'utmCopy') { var lk = document.getElementById('utmLink').textContent; try { navigator.clipboard.writeText(lk).then(function () { b.textContent = '복사됨'; }); } catch (err) { prompt('복사하세요', lk); } }
  else if (b.id === 'pdelsel') { var ids = Object.keys(PSEL); if (ids.length && confirm('선택한 ' + ids.length + '명의 기록을 모두 삭제할까요? 통계에서도 빠지고, 되돌릴 수 없어요.')) { b.disabled = true; b.textContent = '삭제 중…'; apost({ kind: 'admin_edit', op: 'people_delete', sids: ids }).then(function (j) { PSEL = {}; if (j && j.ok) alert(ids.length + '명의 기록(' + j.removed + '줄)을 삭제했어요.'); load(); }, load); } }
  else if (b.dataset.filter) { FILTER = b.dataset.filter; render(); }
  else if (b.dataset.cfilter) { CFILTER = b.dataset.cfilter; render(); }
  else if (b.dataset.reply) {
    var ta = document.getElementById('r_' + b.dataset.reply), t = ta ? ta.value.trim() : '';
    if (!t) { ta && ta.focus(); return; }
    b.disabled = true; b.textContent = '등록 중…'; apost({ kind: 'admin_reply', id: b.dataset.reply, text: t }).then(load, load);
  }
  else if (b.dataset.cdone || b.dataset.creopen) { b.disabled = true; apost({ kind: 'admin_status', id: b.dataset.cdone || b.dataset.creopen, status: b.dataset.cdone ? '답변 완료' : '대기' }).then(load, load); }
  else if (b.dataset.mod) {
    b.disabled = true;
    fetch(ENDPOINT + '?action=' + b.dataset.mod + '&id=' + encodeURIComponent(b.dataset.id) + '&key=' + encodeURIComponent(KEY)).then(function () { load(); });
  }
});
if (!ENDPOINT) setup(); else if (!KEY) login(); else load();
</script>
